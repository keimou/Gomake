# 

# jwt configuration
jwt:
  signing-key: 'keimouKey'
  expires-time: 604800
  buffer-time: 86400
  issuer: 'keid'

# zap logger configuration
zap:
  level: debug  # debug info warn error dpanic panic fatal
  prefix: '[keid]'
  format: console
  director: log
  encode-level: CapitalLevelEncoder    # CapitalLevelEncoder CapitalColorLevelEncoder LowercaseColorLevelEncoder
  stacktrace-key: stacktrace
  max-age: 30
  show-line: true
  log-in-console: true
  replace-gin: true

# email configuration
email:
  to: 'xxx@qq.com'
  port: 465
  from: 'xxx@163.com'
  host: 'smtp.163.com'
  is-ssl: true
  secret: 'xxx'
  nickname: 'test'


# system configuration
system:
  env: 'public'  # Change to "develop" to skip authentication for development mode
  addr: 8080
  db-type: 'mysql'     # 数据库的类型,目前支持 mysql sqlite
  oss-type: 'local'    # 控制oss选择走本地还是 七牛等其他仓 自行增加其他oss仓可以在 server/utils/upload/upload.go 中 NewOss函数配置
  use-redis: false     # 使用redis
  use-netip: true      # 使用公网ip地址
  single-signon: false # 单点登录 use-multipoint 多点登录
  # use-multipoint: false # 多点登录拦截
  use-certif: false    # Use TLS certificate
  cert-file: 'certs/certFile.crt'
  key-file: 'certs/keyFile.key'
  # IP限制次数 一个小时15000次
  iplimit-count: 15000
  #  IP限制一个小时
  iplimit-time: 3600

# captcha configuration
captcha:
  key-long: 6
  img-width: 240
  img-height: 80

